<form [formGroup]="meForm" (ngSubmit)="onSubmitForm()">
  <h2>Profil utilisateur</h2>
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input
      matInput
      type="text"
      placeholder="username"
      formControlName="username"
    />
    <mat-error>{{
      getFormControlErrorText(meForm.controls["username"])
    }}</mat-error>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input
      matInput
      type="email"
      placeholder="email@example.com"
      formControlName="email"
    />
    <mat-error>{{
      getFormControlErrorText(meForm.controls["email"])
    }}</mat-error>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input
      matInput
      type="password"
      placeholder="Exemple123!"
      formControlName="password"
    />
    <mat-error>{{
      getFormControlErrorText(meForm.controls["password"])
    }}</mat-error>
  </mat-form-field>
  <app-button
    type="submit"
    label="Sauvegarder"
    [disabled]="meForm.invalid"
  ></app-button>
</form>

<div class="topics-container">
  <h1>Abonnements</h1>
  <div class="topics-subscribed-container">
    @for (topic of topicsSubscribed$ | async; track topic.id) {
    <app-topic-list-item
      [topic]="topic"
      [isUserProfile]="true"
      (subscriptionEvent)="onSubscription($event)"
    ></app-topic-list-item>
    }
  </div>
</div>
