<app-card (click)="viewSinglePost()">
  <div title>{{ post.title }}</div>
  <div subtitle>
    <div class="subtitles-wrapper">
      <span>Date: {{ post.createdAt | date : "dd/MM/YYYY" }}</span>
      <span>Auteur: {{ post.authorName }}</span>
    </div>
  </div>
  <div content>
    <p>Content :</p>
    <p>
      {{ post.content }}
    </p>
  </div>
</app-card>
