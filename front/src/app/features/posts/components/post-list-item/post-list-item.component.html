<mat-card>
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <mat-card-subtitle>
      <p>Date: {{ post.createdAt }}</p>
      <p>Auteur: {{ post.author }}</p>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>
      {{ post.content }}
    </p>
  </mat-card-content>
</mat-card>
