<mat-card>
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <div class="subtitles-wrapper">
      <mat-card-subtitle>
        <span>Date: {{ post.createdAt | date : "dd/MM/YYYY" }}</span>
      </mat-card-subtitle>
      <mat-card-subtitle>
        <span>Auteur: {{ post.authorName }}</span>
      </mat-card-subtitle>
    </div>
  </mat-card-header>
  <mat-card-content>
    <p>Content :</p>
    <p>
      {{ post.content }}
    </p>
  </mat-card-content>
</mat-card>
