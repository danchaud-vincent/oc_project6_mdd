<h1>Se connecter</h1>
<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <div class="form-row">
    <label>Adresse email ou nom d'utilisateur</label>
    <mat-form-field>
      <mat-label>example&#64;email.com</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error>{{
        getFormControlErrorText(loginForm.controls["email"])
      }}</mat-error>
    </mat-form-field>
  </div>
  <div class="form-row">
    <label>Mot de passe</label>
    <mat-form-field>
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-error>Ce champs est requis</mat-error>
    </mat-form-field>
  </div>
  <div class="btns-actions">
    <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
  </div>

  @if (errorMessage) {
  <div class="error-message">{{ errorMessage }}</div>
  }
</form>
