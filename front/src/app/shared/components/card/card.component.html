<mat-card [class.clickable]="clickable">
  <mat-card-header>
    <mat-card-title>
      <ng-content select="[title]"></ng-content>
    </mat-card-title>
    <mat-card-subtitle>
      <ng-content select="[subtitle]"></ng-content>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ng-content select="[content]"></ng-content>
  </mat-card-content>
  @if (hasActions) {
  <mat-card-actions>
    <ng-content select="[actions]"></ng-content>
  </mat-card-actions>
  }
</mat-card>
