<form [formGroup]="addComment" (ngSubmit)="onSubmitForm()">
  <mat-form-field appearance="outline">
    <mat-label>Contenu du commentaire</mat-label>
    <textarea matInput rows="4" formControlName="comment"></textarea>
    <mat-error>{{
      getFormControlErrorText(addComment.controls["comment"])
    }}</mat-error>
  </mat-form-field>
  <button type="submit">
    <mat-icon>send</mat-icon>
  </button>
</form>
